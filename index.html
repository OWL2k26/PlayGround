<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0d0f1a">
<title>Ring Rise</title>
<style>
html,body{margin:0;height:100%;background:#0d0f1a;overflow:hidden;overscroll-behavior:none;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;display:block;touch-action:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
// palette: dark bg + mint, pink, gold (+ off-white text)
const BG='#0d0f1a',MINT='#3de0c6',PINK='#ff4f78',GOLD='#ffd447',INK='#f4f6ff';
const LW=360,R=60,TH=11,BR=8,BX=LW/2,GAP=230,SPACE=2*R+GAP,PI=Math.PI,ZONE=BR+TH/2;
let H=640,sc=1,ox=0,dpr=1,BY=474;
let state='ready',score=0,best=0,spawned=0,speed=0,t=0,shake=0,pulse=0,overAt=0,newBest=false,muted=false,last=0;
let rings=[],stars=[],parts=[];

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v);}catch(e){return null;}}
best=parseInt(ls('rr_best'),10)||0;
muted=ls('rr_mute')==='1';

/* ---------- audio ---------- */
let ac=null;
function audio(){
  if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)();}catch(e){ac=null;}}
  if(ac&&ac.state==='suspended')ac.resume();
}
function tone(f1,f2,dur,type,vol,delay){
  if(muted||!ac)return;
  const t0=ac.currentTime+(delay||0),o=ac.createOscillator(),g=ac.createGain();
  o.type=type||'sine';
  o.frequency.setValueAtTime(f1,t0);
  o.frequency.exponentialRampToValueAtTime(f2,t0+dur);
  g.gain.setValueAtTime(vol||.12,t0);
  g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  o.connect(g);g.connect(ac.destination);
  o.start(t0);o.stop(t0+dur+.03);
}

/* ---------- setup ---------- */
function resize(){
  const w=innerWidth,h=innerHeight;
  dpr=Math.min(window.devicePixelRatio||1,2);
  cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
  cv.style.width=w+'px';cv.style.height=h+'px';
  const gw=Math.min(w,h*0.62);          // portrait column, centred on wide screens
  sc=gw/LW;ox=(w-gw)/2;H=h/sc;BY=H*0.74;
  if(state==='ready'||!rings.length)reset();
}
function makeRing(y){
  const L=Math.min(Math.max(spawned-2,0),45);spawned++;   // difficulty level
  const om=(0.9+L*0.02)*(0.85+Math.random()*0.3);        // spin speed
  return{y:y,ph:Math.random()*PI*2,w:om*(Math.random()<.5?-1:1),gh:0.88-L*0.0058,st:0,fl:0};
}
function fill(){
  let top=rings.length?rings[rings.length-1].y:BY-430+SPACE;
  while(top>-(R+30)){top-=SPACE;rings.push(makeRing(top));}
}
function reset(){
  score=0;spawned=0;rings=[];parts=[];shake=0;pulse=0;newBest=false;speed=0;
  fill();
}
for(let i=0;i<34;i++)stars.push({x:Math.random()*LW,y:Math.random()*1100,k:.12+Math.random()*.3,s:1+Math.random()*1.6});

function burst(x,y,col,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*PI*2,s=60+Math.random()*220;
    parts.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,l:1,c:col});
  }
}
function die(){
  state='over';overAt=performance.now();shake=.35;
  if(score>best){best=score;newBest=true;ls('rr_best',String(best));}
  burst(BX,BY,GOLD,22);
  tone(320,45,.5,'sawtooth',.18);
}

/* ---------- input ---------- */
function flip(){
  const r=rings.find(q=>q.st===0);
  if(!r)return;
  r.w=-r.w;r.fl=1;
  tone(280,430,.06,'square',.06);
}
function act(){
  if(state==='ready'){state='play';}
  else if(state==='play'){flip();}
  else if(state==='over'){if(performance.now()-overAt>450){reset();state='play';}}
  else if(state==='paused'){state='play';last=performance.now();}
}
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();audio();
  const x=(e.clientX-ox)/sc,y=e.clientY/sc;
  if(Math.hypot(x-(LW-30),y-34)<28){
    muted=!muted;ls('rr_mute',muted?'1':'0');
    if(!muted)tone(600,900,.08,'triangle',.1);
    return;
  }
  act();
},{passive:false});
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();audio();act();}});
function pause(){if(state==='play')state='paused';}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
window.addEventListener('blur',pause);
window.addEventListener('pagehide',pause);
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));

/* ---------- update ---------- */
function update(dt){
  if(state==='paused')return;
  t+=dt;
  if(state==='play')speed=235+Math.min(score,45)*3.2;      // ramps 235 -> ~380
  for(const s of stars){
    s.y+=(state==='play'?speed:24)*s.k*dt;
    if(s.y>H+4){s.y=-Math.random()*40;s.x=Math.random()*LW;}
  }
  for(const p of parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=.98;p.vy*=.98;p.l-=dt*1.8;}
  parts=parts.filter(p=>p.l>0);
  shake=Math.max(0,shake-dt);pulse=Math.max(0,pulse-dt*4);
  for(const r of rings){
    if(state!=='over')r.ph+=r.w*dt;
    r.fl=Math.max(0,r.fl-dt*5);
  }
  if(state!=='play')return;

  for(const r of rings)r.y+=speed*dt;
  for(const r of rings){
    if(r.st===0&&r.y+R>BY-ZONE)r.st=1;                       // ball reaches ring
    if(r.st===1&&r.y-R>BY+ZONE){                             // ball cleared ring
      r.st=2;score++;pulse=1;
      const f=540+Math.min(score,24)*16;
      tone(f,f*1.5,.12,'triangle',.16);
      burst(BX,BY,MINT,6);
    }
  }
  for(const r of rings){
    if(r.st===2)continue;
    const dy=BY-r.y,d=Math.abs(dy);
    if(Math.abs(d-R)<ZONE-1){
      const a=dy>0?PI/2:-PI/2;
      let m=(a-r.ph)%PI;if(m<0)m+=PI;
      m=Math.min(m,PI-m);                                    // distance to nearest gap centre
      if(m>r.gh-0.1){die();return;}
    }
  }
  while(rings.length&&rings[0].y-R>H+40)rings.shift();
  fill();
}

/* ---------- drawing ---------- */
function txt(s,x,y,size,col,al,a){
  ctx.font='800 '+size+'px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif';
  ctx.textAlign=al||'center';ctx.textBaseline='middle';
  ctx.globalAlpha=a===undefined?1:a;ctx.fillStyle=col;
  ctx.fillText(s,x,y);ctx.globalAlpha=1;
}
function rr(x,y,w,h,r){
  ctx.beginPath();ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function arrow(r){
  const cx=BX,cy=r.y,dir=r.w>0?1:-1,a0=r.ph+.5,ae=a0+dir*1.7,ar=24;
  ctx.strokeStyle=PINK;ctx.fillStyle=PINK;ctx.lineWidth=4;ctx.lineCap='round';
  ctx.beginPath();ctx.arc(cx,cy,ar,a0,ae,dir<0);ctx.stroke();
  const px=cx+Math.cos(ae)*ar,py=cy+Math.sin(ae)*ar;
  const tx=-Math.sin(ae)*dir,ty=Math.cos(ae)*dir,nx=-ty,ny=tx;
  ctx.beginPath();
  ctx.moveTo(px+tx*9,py+ty*9);ctx.lineTo(px+nx*6,py+ny*6);ctx.lineTo(px-nx*6,py-ny*6);
  ctx.closePath();ctx.fill();
}
function drawRing(r,target){
  if(r.y<-R-30||r.y>H+R+30)return;
  const cap=(TH/2)/R;
  ctx.lineWidth=TH+r.fl*5;ctx.lineCap='round';
  ctx.strokeStyle=target?PINK:MINT;
  ctx.globalAlpha=target?1:(r.st===2?.25:(r.st===1?.9:.6));
  for(let k=0;k<2;k++){
    ctx.beginPath();
    ctx.arc(BX,r.y,R,r.ph+k*PI+r.gh+cap,r.ph+(k+1)*PI-r.gh-cap);
    ctx.stroke();
  }
  ctx.globalAlpha=1;
  if(target)arrow(r);
}
function drawBall(){
  ctx.fillStyle=GOLD;
  if(state==='play'){
    for(let i=5;i>=1;i--){
      ctx.globalAlpha=.07*(6-i);
      ctx.beginPath();ctx.arc(BX,BY+i*9,BR*(1-i*.1),0,7);ctx.fill();
    }
  }
  ctx.globalAlpha=.18;
  ctx.beginPath();ctx.arc(BX,BY,BR*2.1+pulse*6,0,7);ctx.fill();
  ctx.globalAlpha=1;
  const b=Math.sin(t*9)*.09;
  ctx.beginPath();ctx.ellipse(BX,BY,BR*(1+b+pulse*.2),BR*(1-b+pulse*.2),0,0,7);ctx.fill();
}
function drawMute(){
  ctx.save();ctx.translate(LW-30,34);
  ctx.globalAlpha=.8;ctx.fillStyle=INK;ctx.strokeStyle=INK;ctx.lineWidth=2.5;ctx.lineCap='round';
  ctx.beginPath();
  ctx.moveTo(-9,-4);ctx.lineTo(-4,-4);ctx.lineTo(2,-9);ctx.lineTo(2,9);ctx.lineTo(-4,4);ctx.lineTo(-9,4);
  ctx.closePath();ctx.fill();
  if(muted){
    ctx.beginPath();ctx.moveTo(6,-5);ctx.lineTo(14,5);ctx.moveTo(14,-5);ctx.lineTo(6,5);ctx.stroke();
  }else{
    ctx.beginPath();ctx.arc(2,0,7,-.9,.9);ctx.stroke();
    ctx.beginPath();ctx.arc(2,0,12,-.9,.9);ctx.stroke();
  }
  ctx.restore();
}
function dim(a){ctx.globalAlpha=a;ctx.fillStyle=BG;ctx.fillRect(0,0,LW,H);ctx.globalAlpha=1;}

function draw(){
  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.fillStyle=BG;ctx.fillRect(0,0,cv.width/dpr,cv.height/dpr);
  ctx.setTransform(dpr*sc,0,0,dpr*sc,dpr*ox,0);
  ctx.save();
  ctx.beginPath();ctx.rect(0,0,LW,H);ctx.clip();
  if(shake>0)ctx.translate((Math.random()-.5)*16*shake/.35,(Math.random()-.5)*16*shake/.35);

  ctx.fillStyle=MINT;
  for(const s of stars){ctx.globalAlpha=.25;ctx.fillRect(s.x,s.y,s.s,s.s);}
  ctx.globalAlpha=1;

  const target=rings.find(q=>q.st===0);
  for(const r of rings)drawRing(r,r===target&&state!=='over');
  if(state!=='over')drawBall();
  for(const p of parts){
    ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;
    ctx.beginPath();ctx.arc(p.x,p.y,3*p.l+.5,0,7);ctx.fill();
  }
  ctx.globalAlpha=1;

  if(state==='play'||state==='paused'){
    txt(String(score),LW/2,98,70*(1+pulse*.18),INK,'center',.9);
  }
  if(best>0||state==='play')txt('BEST '+best,22,34,14,INK,'left',.6);
  drawMute();

  if(state==='ready'){
    txt('RING RISE',LW/2,H*.37,54,MINT);
    txt('Tap to reverse the glowing ring\u2019s spin',LW/2,H*.37+48,16,INK,'center',.85);
    txt('Line up the gaps and rise through!',LW/2,H*.37+72,16,INK,'center',.85);
    txt('TAP TO START',LW/2,H*.9,22,GOLD,'center',.55+.45*Math.sin(t*4));
  }else if(state==='paused'){
    dim(.75);
    txt('PAUSED',LW/2,H*.4,44,INK);
    txt('TAP TO RESUME',LW/2,H*.4+50,18,GOLD);
  }else if(state==='over'){
    dim(.8);
    txt('GAME OVER',LW/2,H*.24,38,PINK);
    txt('SCORE',LW/2,H*.33,16,INK,'center',.7);
    txt(String(score),LW/2,H*.4,96,GOLD);
    if(newBest)txt('NEW BEST!',LW/2,H*.49,22,PINK);
    else txt('BEST '+best,LW/2,H*.49,20,INK,'center',.8);
    const ready=performance.now()-overAt>450;
    ctx.globalAlpha=ready?1:.45;
    ctx.fillStyle=MINT;rr(LW/2-130,H*.57,260,80,24);ctx.fill();
    ctx.globalAlpha=1;
    txt('PLAY AGAIN',LW/2,H*.57+40,28,BG);
  }
  ctx.restore();
}

/* ---------- loop ---------- */
function frame(now){
  let dt=(now-last)/1000;last=now;
  if(!(dt>0))dt=0;if(dt>.05)dt=.05;
  update(dt);draw();
  requestAnimationFrame(frame);
}
resize();
last=performance.now();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
